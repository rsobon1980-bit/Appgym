<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sztanga</title>
<meta name="description" content="Dziennik treningowy na siłownię: ćwiczenia, ciężary, powtórzenia, historia i rekordy.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEEF1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sztanga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Układ: szklana pływająca nawigacja, gradienty i karty z miękkim cieniem; każda partia mięśni ma własny kolor (--g) */
  --bg:#F2F3F8; --surface:#FFFFFF; --surface2:#ECEEF5; --ink:#12151C; --mute:#5E6778; --line:#E1E4EC;
  --accent:#E2431F; --accent2:#D9245F; --accent-ink:#FFFFFF;
  --ok:#0E9F8E; --ok-ink:#FFFFFF; --ok-bg:#D9F3EF;
  --glow1:rgba(226,67,31,.15); --glow2:rgba(76,141,255,.13);
  --shadow:0 1px 2px rgba(18,21,28,.05),0 12px 28px -14px rgba(18,21,28,.22);
  --nav-bg:rgba(255,255,255,.84);
  --hero-ink:#F4F6F9; --hero-mute:#B3BDCB;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D13; --surface:#141923; --surface2:#1E2432; --ink:#EEF1F6; --mute:#9AA4B5; --line:#262D3C;
    --accent:#FF6A3D; --accent2:#FF3D77; --accent-ink:#1B0A07;
    --ok:#34D6C0; --ok-ink:#04221E; --ok-bg:#10302C;
    --glow1:rgba(255,106,61,.17); --glow2:rgba(76,141,255,.15);
    --shadow:0 1px 0 rgba(255,255,255,.045) inset,0 14px 30px -14px rgba(0,0,0,.75);
    --nav-bg:rgba(20,25,35,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D13; --surface:#141923; --surface2:#1E2432; --ink:#EEF1F6; --mute:#9AA4B5; --line:#262D3C;
  --accent:#FF6A3D; --accent2:#FF3D77; --accent-ink:#1B0A07;
  --ok:#34D6C0; --ok-ink:#04221E; --ok-bg:#10302C;
  --glow1:rgba(255,106,61,.17); --glow2:rgba(76,141,255,.15);
  --shadow:0 1px 0 rgba(255,255,255,.045) inset,0 14px 30px -14px rgba(0,0,0,.75);
  --nav-bg:rgba(20,25,35,.82);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font-body);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 100% 0%,var(--glow1),transparent 70%),radial-gradient(55% 34% at 0% 26%,var(--glow2),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding-block:10px 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:40px}
.top h1{margin:0;display:flex;align-items:center;gap:10px;font:700 28px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase}
.logo{width:32px;height:32px;flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:999px;padding:5px 12px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad)}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h2{margin:4px 0 6px;font:700 34px/1.05 var(--font-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
p{margin:0}
.mute,small{color:var(--mute)}
small{font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g,var(--mute));margin-right:6px;vertical-align:0}
.btn{min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--surface2);background:var(--grad);color:var(--accent-ink);box-shadow:0 10px 20px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.secondary{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--mute);border-color:var(--line)}
.btn.ghost.warn{color:var(--accent);border-color:var(--accent)}
.btn.big{min-height:56px;font-size:18px;width:100%;margin-top:14px;border-radius:16px}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
/* --- strona główna --- */
.hero2{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:22px 18px 18px;color:var(--hero-ink);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);background:radial-gradient(90% 80% at 96% 100%,rgba(255,106,61,.42),transparent 62%),radial-gradient(70% 60% at 0% 0%,rgba(76,141,255,.18),transparent 60%),linear-gradient(160deg,#1B212D,#0C0F15)}
.hero2::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.hero2-art{position:absolute;right:-96px;top:42%;width:260px;height:260px;margin-top:-130px;opacity:.5;z-index:-1;transform:rotate(-14deg)}
.hero2-art svg{display:block;width:100%;height:100%}
.hero2-in{position:relative;max-width:430px}
.hero2 .eyebrow{color:var(--hero-mute)}
.hero2 h2{color:var(--hero-ink);font-size:42px;max-width:8.5em}
.hero2 p.sub{color:var(--hero-mute);max-width:30ch}
.hero2 .btn.big{width:auto;padding:0 30px;background:var(--grad);color:var(--accent-ink)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.hstat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:10px 12px;min-width:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hstat b{display:block;font:700 27px/1.05 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.hstat span{font-size:11.5px;color:var(--hero-mute);line-height:1.25;display:block}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mute)}
.day i{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-style:normal}
.day.on i{background:var(--grad);color:var(--accent-ink)}
.day.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.day.today span{color:var(--ink)}
.day svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin-top:6px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:104px;border-radius:20px;border:1px solid var(--line);background:var(--surface);background:linear-gradient(165deg,color-mix(in srgb,var(--g) 22%,var(--surface)),var(--surface) 75%);padding:8px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;box-shadow:var(--shadow)}
.tfig{display:block;width:100%;aspect-ratio:1;background:var(--surface2);background:color-mix(in srgb,var(--g) 14%,var(--surface2));border-radius:14px;padding:2px}
.mini{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{display:block;font:700 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
/* --- trening --- */
.card.run{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:var(--hero-ink);border-color:rgba(255,255,255,.08);background:radial-gradient(80% 120% at 100% 100%,rgba(255,106,61,.35),transparent 60%),linear-gradient(160deg,#1B212D,#0C0F15)}
.card.run .eyebrow,.card.run small{color:var(--hero-mute)}
.clock{font:700 46px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.vol{text-align:right;display:flex;flex-direction:column}
.vol b{font:700 30px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.exhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.exname{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.techbox{margin-bottom:14px}
.sets{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:2rem 1fr 1fr 50px;gap:8px;align-items:center}
.srow.head{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center}
.srow .n{font:700 20px/1 var(--font-display);color:var(--mute);text-align:center}
.srow input{width:100%;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);text-align:center;font:600 21px/1 var(--font-body);font-variant-numeric:tabular-nums}
.srow input::placeholder{color:var(--mute);opacity:.55}
.srow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
.srow.done input{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.chk{width:50px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--mute);display:grid;place-items:center;padding:0}
.chk svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.srow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.exfoot{display:flex;gap:8px;margin-top:12px}
/* --- ćwiczenia --- */
.searchrow input[type=search]{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;box-shadow:var(--shadow)}
.chips{display:flex;flex:none;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:500;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{width:100%;display:flex;align-items:center;gap:13px;text-align:left;min-height:76px;padding:8px 14px 8px 8px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.item .nm{display:flex;flex-direction:column;min-width:0;flex:1;font-weight:500}
.thumb{flex:none;width:58px;height:58px;border-radius:14px;background:var(--surface2);background:color-mix(in srgb,var(--g,var(--mute)) 15%,var(--surface2));padding:2px;display:block}
.thumb.sm{width:46px;height:46px;border-radius:12px}
button.tbtn{border:1px solid var(--line);cursor:pointer}
.detail{margin-top:8px;padding:12px;border-radius:18px;background:var(--surface2);display:flex;flex-direction:column;gap:12px}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.detail dt{color:var(--mute)}
.detail dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:30px 14px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:20px}
/* --- historia --- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--surface2)}
.seg button{min-height:42px;border-radius:12px;border:0;background:transparent;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.whead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:0}
.whead div{display:flex;flex-direction:column;min-width:0}
.whead .big{font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wbody{margin-top:12px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.wi b{font-weight:600}
.setchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.setchips span{padding:4px 11px;border-radius:999px;background:var(--surface2);font-size:14px;font-variant-numeric:tabular-nums}
.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.rec div{display:flex;flex-direction:column;min-width:0}
.rec .recv{text-align:right;font-variant-numeric:tabular-nums}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.form select,.set select{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;width:100%}
.install{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set{display:flex;flex-direction:column;gap:12px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set select{width:auto;min-width:112px}
.foot{font-size:13px;color:var(--mute)}
/* --- ilustracje --- */
.fig{display:block;width:100%;height:auto}
.fg{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg2{stroke:var(--mute);opacity:.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fgh{fill:var(--ink)}
.fe{fill:var(--g,var(--accent))}
.fh{fill:var(--surface)}
.fl{stroke:var(--g,var(--accent));fill:none}
.fp{stroke:var(--mute);opacity:.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fl2{stroke:var(--line);stroke-width:1.2;fill:none}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:var(--surface2);background:color-mix(in srgb,var(--g,var(--mute)) 12%,var(--surface2));border-radius:18px;padding:12px}
.pair.one{grid-template-columns:minmax(0,200px);justify-content:center}
.detail .pair{background:color-mix(in srgb,var(--g,var(--mute)) 12%,var(--surface))}
.pair figure{margin:0;min-width:0}
.pair figcaption{text-align:center;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.arr{width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* --- nawigacja, przerwa, arkusz --- */
#tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#tabs div{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:26px;background:var(--surface);background:var(--nav-bg);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--shadow)}
#tabs button{min-height:54px;border:0;border-radius:20px;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600}
#tabs button[aria-current="page"]{color:var(--accent);background:var(--surface2);background:color-mix(in srgb,var(--accent) 13%,transparent)}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#restbar{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:612px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:11px 12px 14px;display:flex;align-items:center;gap:10px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.45)}
#restbar .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
#restbar b{font:700 32px/1 var(--font-display);font-variant-numeric:tabular-nums;margin-right:auto;display:block}
#restbar button{min-height:38px;padding:0 12px;border-radius:12px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:600}
#restbar .rp{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(127,127,127,.28)}
#restbar .rp i{display:block;height:100%;width:100%;background:var(--grad)}
#sheet{position:fixed;inset:0;z-index:40}
#sheet .backdrop{position:absolute;inset:0;background:rgba(5,7,11,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
#sheet .panel::before{content:"";align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);margin-bottom:2px}
#sheet .panel>*{flex:none}
#sheet .ph{display:flex;justify-content:space-between;align-items:center}
#sheet .ph h2{margin:0;font-size:27px}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.item,.tile{transition:background-color .15s,border-color .15s,transform .15s}.btn:active,.tile:active,.item:active{transform:scale(.98)}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A52"/><stop offset="1" stop-color="#E5326B"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#lg)"/><circle cx="16" cy="16" r="9" fill="#10141A"/><circle cx="16" cy="16" r="3.4" fill="url(#lg)"/></svg>Sztanga</h1><span id="topinfo"></span></header>
  <main id="view"></main>
</div>

<div id="restbar" hidden>
  <div><span class="lbl">Przerwa</span><b id="restclock">0:00</b></div>
  <button type="button" data-act="restadd" data-d="-15" aria-label="Skróć przerwę o 15 sekund">−15 s</button>

/* ---------- Ilustracje ćwiczeń: figurki rysowane z kątów stawów ---------- */

  function pt(p,a,l){return [p[0]+Math.sin(a*R)*l,p[1]+Math.cos(a*R)*l];}

  function solve(p){

    if(p.benchU){o+=seg([[s.sho[0]-9,s.sho[1]+6.5],[s.sho[0]+7,s.sho[1]+6.5]],4.4,'fp')+seg([[s.sho[0]-1,s.sho[1]+6.5],[s.sho[0]-1,GY+1]],2,'fp');}
    if(p.bar!=null){o+=seg([[30,p.bar],[70,p.bar]],2.6,'fp')+seg([[30,p.bar],[30,p.bar-6]],2.6,'fp')+seg([[70,p.bar],[70,p.bar-6]],2.6,'fp');}
    if(p.dip!=null){o+=seg([[p.dipx-10,p.dip],[p.dipx+8,p.dip]],3,'fp')+seg([[p.dipx+8,p.dip],[p.dipx+8,GY+1]],2.4,'fp');}
    if(p.pad){o+=seg([[p.pad[0],p.pad[1]],[p.pad[2],p.pad[3]]],5,'fp')+seg([[p.pad[2],p.pad[3]],[p.pad[2]-3,GY+1]],2.4,'fp');}
    if(p.plat){
      var sa=p.plat*R,sv=[Math.sin(sa),Math.cos(sa)],pp=[Math.cos(sa),-Math.sin(sa)];

      o+=seg([a1,a2],4.4,'fp');
    }
    if(p.pl&&p.eq==='cable'){o+=seg([p.pl,s.wr],1.3,'fl');o+='<circle class="fe" cx="'+f(p.pl[0])+'" cy="'+f(p.pl[1])+'" r="2.6"/>';}
    /* druga noga i ramię (słabiej) */

    if(p.leg2){

    }
    /* postać */
    o+=seg([s.hip,s.knee,s.ankle,toe],5.4,'fg');
    o+=seg([s.hip,s.sho],7.4,'fg');
    o+=seg([s.sho,s.el,s.wr],4.8,'fg');
    o+='<circle class="fgh" cx="'+f(s.head[0])+'" cy="'+f(s.head[1])+'" r="5.3"/>';

    else if(eq==='cable'){o+='<circle class="fe" cx="'+f(s.wr[0])+'" cy="'+f(s.wr[1])+'" r="2.6"/>';}
    return o;
  }
  /* wzorce ruchu: a = start, b = koniec */
  var LY={ax:70,th:70,sh:8,t:-90,hd:-90,bench:1};
  var SEAT={th:88,sh:2,t:-6,bench:1};

    pulldown:{eq:'cable',x:{hp:[42,77],th:86,sh:2,t:-8,bench:1,pl:[48,2]},a:{ua:168,fa:172},b:{ua:-15,fa:125}},
    seatRow:{eq:'cable',x:{ax:80,th:80,sh:80,t:-5,pl:[99,88],bench:0},a:{ua:95,fa:92},b:{ua:-80,fa:100,t:-14}},
    squat:{eq:'bb',at:'sho',x:{ax:48},a:{t:5,th:0,sh:0,ua:-25,fa:155},b:{t:40,th:85,sh:-32,ua:5,fa:185,hd:30}},
    fsquat:{eq:'bb',at:'wr',x:{ax:48},a:{t:0,th:0,sh:0,ua:75,fa:250},b:{t:25,th:85,sh:-28,ua:75,fa:250,hd:15}},
    legpress:{x:{hp:[34,72],t:-58,hd:-58,bench:1,seatLen:2},a:{th:118,sh:62,ua:60,fa:80,plat:62},b:{th:106,sh:106,ua:60,fa:80,plat:106}},
    lunge:{eq:'db',x:{ax:56},a:{th:0,sh:0,t:0,ua:0,fa:0,leg2:[-8,-6]},b:{th:84,sh:-6,t:4,ua:0,fa:0,leg2:[-38,-108]}},
    legcurl:{x:{hp:[50,76],th:90,t:-90,hd:-90,bench:1,seatLen:20},a:{sh:90,ua:-10,fa:-172},b:{sh:150,ua:-10,fa:-172}},
    legext:{x:{hp:[40,76],th:88,t:-6,bench:1,seatLen:19},a:{sh:0,ua:15,fa:60},b:{sh:88,ua:15,fa:60}},
    hipthrust:{eq:'bb',at:'hip',x:{ax:74,sh:0,benchU:1},a:{th:130,t:-62,hd:-62,ua:90,fa:90},b:{th:88,t:-90,hd:-80,ua:90,fa:90}},
    calf:{eq:'db',x:{ax:50,th:0,sh:0,t:0,ua:2,fa:2},a:{},b:{lift:6}},
    ohp:{eq:'bb',x:{ax:50},a:{ua:30,fa:185},b:{ua:178,fa:180}},
    ohpSeat:{eq:'db',x:{hp:[42,76],th:88,sh:2,t:-3,bench:1},a:{ua:30,fa:185},b:{ua:178,fa:180}},
    lateral:{eq:'db',x:{ax:50},a:{ua:3,fa:3},b:{ua:84,fa:88}},

    }
  };
})();

/* ---------- Trening ---------- */
function startW(){if(!S.active){S.active={id:uid(),start:Date.now(),items:[]};save();}}
function addEx(id){
  startW();
  var info=exInfo(id),ls=lastSets(id);
  var sets=(ls&&ls.length?ls:[{},{},{}]).map(function(s){
    return {kg:s.kg!=null?String(s.kg):'',reps:s.reps!=null?String(s.reps):'',done:false};
  });
  S.active.items.push({ex:id,name:info.name,group:info.group,sets:sets});
  save();
}
function startRest(){
  if(S.rest>0){rest={end:Date.now()+S.rest*1000,total:S.rest*1000};updRest();}
}
function updRest(){
  var b=$('#restbar');
  if(!rest){b.hidden=true;return;}
  var left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){
    rest=null;b.hidden=true;
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
    toast('Koniec przerwy. Czas na kolejną serię');
    return;
  }
  b.hidden=false;$('#restclock').textContent=clock(left*1000);
  $('#restfill').style.width=Math.max(0,Math.min(100,(rest.end-Date.now())/rest.total*100))+'%';
}
function finishW(){
  var a=S.active;if(!a)return;
  var items=[];
  a.items.forEach(function(it){
    var sets=it.sets.filter(function(s){return s.done&&(num(s.reps)>0);}).map(function(s){return {kg:num(s.kg),reps:num(s.reps)};});
    if(sets.length)items.push({ex:it.ex,name:it.name,group:it.group,sets:sets});
  });
  if(!items.length){toast('Zaznacz przynajmniej jedną serię z powtórzeniami');return;}
  S.workouts.unshift({id:a.id,date:a.start,dur:Date.now()-a.start,items:items});
  S.active=null;rest=null;save();updRest();
  ui.tab='hist';ui.hist='workouts';ui.openW=a.id;
  toast('Trening zapisany');
}

/* ---------- Widoki ---------- */
function chips(ctx){
  return '<div class="chips" role="group" aria-label="Partia mięśni">'+['Wszystkie'].concat(GROUPS).map(function(g){
    return '<button type="button" class="chip" data-act="grp" data-ctx="'+ctx+'" data-g="'+g+'" aria-pressed="'+(ui.g[ctx]===g)+'"'+gs(g)+'>'+(GC[g]?'<i class="dot"></i>':'')+g+'</button>';
  }).join('')+'</div>';

function itemInner(e){return '<span class="thumb"'+gs(e.group)+'>'+FIG.thumb(e)+'</span><span class="nm"><span>'+esc(e.name)+'</span><small><i class="dot"'+gs(e.group)+'></i>'+esc(e.group)+'</small></span>';}
function libItem(e){
  var open=ui.open===e.id;

    if(st.best){
      h+='<dl><dt>Rekord</dt><dd>'+esc(setTxt(st.best))+'</dd>'+
         (st.e1?'<dt>Szac. 1RM</dt><dd>'+fmt(st.e1.v)+' kg</dd>':'')+
         '<dt>Ostatnio</dt><dd>'+esc(dstr(st.last.date))+': '+esc(setTxt(topSet(st.last.sets)))+'</dd></dl>';
    }else{h+='<p class="mute">Jeszcze nie ćwiczone. Po pierwszym treningu zobaczysz tu rekordy.</p>';}

    if(e.custom){h+='<button type="button" class="btn ghost warn sm" data-act="delcustom" data-id="'+e.id+'">'+(armed('delcustom:'+e.id)?'Na pewno? Dotknij ponownie':'Usuń ćwiczenie')+'</button>';}

function exList(ctx){
  var q=ui.q[ctx].trim().toLowerCase(),g=ui.g[ctx];

function installCard(){
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(standalone)return '';
  if(dip)return '<section class="card install"><div><b>Zainstaluj Sztangę</b><p class="mute">Ikona na ekranie głównym i działanie bez internetu.</p></div><button type="button" class="btn primary" data-act="install">Zainstaluj</button></section>';
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))return '<section class="card"><b>Dodaj do ekranu głównego</b><p class="mute">W Safari dotknij ikony Udostępnij, a potem „Do ekranu początkowego”.</p></section>';

function exCard(it,i){

      '<input type="text" inputmode="numeric" autocomplete="off" aria-label="Powtórzenia, seria '+(j+1)+'" placeholder="0" value="'+esc(s.reps)+'" data-f="reps" data-i="'+i+'" data-j="'+j+'">'+
      '<button type="button" class="chk" data-act="done" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+!!s.done+'" aria-label="Seria '+(j+1)+' zaliczona"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>';

var CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function heroArt(){
  var t='';
  for(var i=0;i<24;i++){
    var a=i*15*Math.PI/180,x1=110+Math.sin(a)*70,y1=110-Math.cos(a)*70,x2=110+Math.sin(a)*79,y2=110-Math.cos(a)*79;
    t+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="rgba(255,255,255,.55)" stroke-width="2.4" stroke-linecap="round"/>';
  }
  return '<svg viewBox="0 0 220 220" aria-hidden="true" focusable="false"><defs><linearGradient id="gpl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A52"/><stop offset="1" stop-color="#D9381E"/></linearGradient></defs>'+
    '<circle cx="110" cy="110" r="106" fill="url(#gpl)"/><circle cx="110" cy="110" r="90" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'+t+
    '<circle cx="110" cy="110" r="60" fill="#10141A"/><circle cx="110" cy="110" r="22" fill="url(#gpl)"/><circle cx="110" cy="110" r="9" fill="#10141A"/></svg>';
}
function weekStrip(){
  var names=['Nd','Pn','Wt','Śr','Cz','Pt','So'],days=[],now=new Date(),n=0;
  for(var d=6;d>=0;d--){
    var a=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d).getTime(),b=a+864e5;
    var on=S.workouts.some(function(w){return w.date>=a&&w.date<b;});
    if(on)n++;
    days.push('<div class="day'+(on?' on':'')+(d===0?' today':'')+'"><span>'+names[new Date(a).getDay()]+'</span><i>'+(on?CHK:'')+'</i></div>');
  }
  return '<section class="card"><div class="wkhead"><b>Ostatnie 7 dni</b><small>'+n+' z 7 dni z treningiem</small></div><div class="wk">'+days.join('')+'</div></section>';
}
function vTrain(){
  var a=S.active;
  if(!a){
    var wk=Date.now()-7*864e5,rec=S.workouts.filter(function(w){return w.date>=wk;});
    var vol=rec.reduce(function(t,w){return t+volume(w.items);},0);
    var lw=S.workouts[0];
    var hstats='<div class="hstats"><div class="hstat"><b>'+rec.length+'</b><span>treningi w tym tygodniu</span></div><div class="hstat"><b>'+(vol>=1000?fmt(vol/1000)+' t':fmt(vol)+' kg')+'</b><span>objętość (7 dni)</span></div><div class="hstat"><b>'+S.workouts.length+'</b><span>treningów łącznie</span></div></div>';
    var h='<section class="hero2"><div class="hero2-art">'+heroArt()+'</div><div class="hero2-in"><p class="eyebrow">'+esc(dstr(Date.now()))+'</p><h2>Gotowy na trening?</h2>'+
      '<p class="sub">Wybierz ćwiczenia, wpisz ciężar i powtórzenia. Wartości z ostatniego razu wpiszą się same.</p>'+
      '<button type="button" class="btn big" data-act="start">Rozpocznij trening</button></div>'+hstats+'</section>'+
      installCard()+weekStrip()+
      '<div><p class="eyebrow">Zacznij od partii</p><div class="tiles">'+GROUPS.map(function(g){
        return '<button type="button" class="tile" data-act="grouppick" data-g="'+g+'"'+gs(g)+'><span class="tfig">'+FIG.thumb({name:'',group:g})+'</span><span>'+g+'</span></button>';
      }).join('')+'</div></div>'+
      '';
    if(lw){
      h+='<section class="card"><p class="eyebrow">Ostatni trening</p><h3 style="margin-top:6px">'+esc(dstr(lw.date))+' · '+fmt(volume(lw.items))+' kg</h3>'+
         '<p class="mute" style="margin-top:4px">'+lw.items.map(function(it){return esc(it.name||exInfo(it.ex).name);}).join(', ')+'</p>'+
         '<div class="mini">'+lw.items.slice(0,6).map(function(it){return '<span class="thumb sm"'+gs(it.group||exInfo(it.ex).group)+'>'+FIG.thumb({name:it.name||exInfo(it.ex).name,group:it.group||exInfo(it.ex).group})+'</span>';}).join('')+'</div></section>';
    }
    return h;
  }
  var h2='<section class="card run"><div><p class="eyebrow">Trwa trening</p><div class="clock" id="elapsed">'+clock(Date.now()-a.start)+'</div></div>'+
    '<div class="vol"><small>Objętość</small><b id="vol">'+fmt(volume(a.items,true))+' kg</b></div></section>';
  if(!a.items.length){
    h2+='<section class="card"><p class="empty">Nie ma jeszcze ćwiczeń. Dodaj pierwsze, żeby wpisywać serie.</p></section>';
  }else{h2+=a.items.map(exCard).join('');}
  h2+='<button type="button" class="btn secondary wide" data-act="pick">+ Dodaj ćwiczenie</button>'+
    '<div class="row2"><button type="button" class="btn primary" data-act="finish">Zakończ trening</button>'+
    '<button type="button" class="btn ghost'+(armed('cancel:')?' warn':'')+'" data-act="cancel">'+(armed('cancel:')?'Na pewno? Dotknij ponownie':'Anuluj trening')+'</button></div>';
  return h2;
}
function vLib(){
  var h='<div class="searchrow"><input type="search" id="q-lib" data-q="lib" placeholder="Szukaj ćwiczenia" aria-label="Szukaj ćwiczenia" value="'+esc(ui.q.lib)+'"></div>'+chips('lib')+'<div id="list-lib">'+exList('lib')+'</div>';
  if(ui.adding){
    h+='<section class="card form"><h3>Własne ćwiczenie</h3><input type="text" id="newname" placeholder="Nazwa, np. Wyciskanie na suwnicy Smitha" aria-label="Nazwa ćwiczenia" maxlength="60">'+
      '<select id="newgrp" aria-label="Partia mięśni">'+GROUPS.map(function(g){return '<option>'+g+'</option>';}).join('')+'</select>'+
      '<div class="row2"><button type="button" class="btn primary" data-act="savecustom">Zapisz</button><button type="button" class="btn ghost" data-act="cancelform">Anuluj</button></div></section>';
  }else{h+='<button type="button" class="btn secondary wide" data-act="addform">+ Własne ćwiczenie</button>';}
  return h;
}
function wCard(w){
  var open=ui.openW===w.id,k='delw:'+w.id;
  var h='<article class="card"><button type="button" class="whead" data-act="openw" data-id="'+w.id+'" aria-expanded="'+open+'"><div><b>'+esc(dstr(w.date))+'</b><small>'+w.items.length+' ćw. · '+Math.max(1,Math.round(w.dur/60000))+' min</small></div><span class="big">'+fmt(volume(w.items))+' kg</span></button>';
  if(open){
    h+='<div class="wbody">'+w.items.map(function(it){
      return '<div class="wi"><b>'+esc(it.name||exInfo(it.ex).name)+'</b><div class="setchips">'+it.sets.map(function(s){return '<span>'+esc(setTxt(s))+'</span>';}).join('')+'</div></div>';
    }).join('')+'<button type="button" class="btn ghost sm'+(armed(k)?' warn':'')+'" data-act="delw" data-id="'+w.id+'">'+(armed(k)?'Na pewno? Dotknij ponownie':'Usuń trening')+'</button></div>';
  }
  return h+'</article>';

function vRecs(){
  var seen={},list=[];
  S.workouts.forEach(function(w){w.items.forEach(function(it){if(!seen[it.ex]){seen[it.ex]=1;list.push(it);}});});
  if(!list.length)return '<p class="empty">Rekordy pojawią się po pierwszym zapisanym treningu.</p>';
  return '<ul class="list">'+list.map(function(it){
    var s=exStats(it.ex);
    return '<li class="rec"><div><b>'+esc(it.name||exInfo(it.ex).name)+'</b><small>'+esc(dstr(s.best.date))+'</small></div><div class="recv"><b>'+esc(setTxt(s.best))+'</b>'+(s.e1?'<small>1RM ok. '+fmt(s.e1.v)+' kg</small>':'')+'</div></li>';
  }).join('')+'</ul><p class="foot">1RM to szacowany ciężar na jedno powtórzenie (wzór Epleya).</p>';
}
function vHist(){
  var h='<div class="seg" role="group" aria-label="Widok historii"><button type="button" data-act="hist" data-v="workouts" aria-pressed="'+(ui.hist==='workouts')+'">Treningi</button><button type="button" data-act="hist" data-v="recs" aria-pressed="'+(ui.hist==='recs')+'">Rekordy</button></div>';
  if(ui.hist==='recs'){h+=vRecs();}
  else if(!S.workouts.length){h+='<p class="empty">Tu pojawią się zakończone treningi.</p>';}
  else{h+=S.workouts.map(wCard).join('');}
  h+='<section class="card set"><h3>Ustawienia i kopia zapasowa</h3>'+
    '<label>Przerwa między seriami<select id="restsel" aria-label="Długość przerwy">'+[0,60,90,120,180,240].map(function(v){return '<option value="'+v+'"'+(S.rest===v?' selected':'')+'>'+(v?v+' s':'wyłączona')+'</option>';}).join('')+'</select></label>'+
    '<div class="row2" style="grid-template-columns:1fr 1fr"><button type="button" class="btn secondary sm" data-act="export">Pobierz kopię</button><button type="button" class="btn secondary sm" data-act="copy">Kopiuj dane</button></div>'+
    '<button type="button" class="btn ghost sm" data-act="import">Wczytaj kopię z pliku</button>'+
    '<p class="foot">Dane są zapisane tylko w tym telefonie. Zrób kopię przed czyszczeniem danych przeglądarki lub zmianą telefonu.</p></section>';
  return h;
}
function vSheet(){
  return '<div class="ph"><h2>Dodaj ćwiczenie</h2><button type="button" class="btn ghost sm" data-act="close">Zamknij</button></div>'+
    '<div class="searchrow"><input type="search" id="q-pick" data-q="pick" placeholder="Szukaj ćwiczenia" aria-label="Szukaj ćwiczenia" value="'+esc(ui.q.pick)+'" style="width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px"></div>'+
    chips('pick')+'<div id="list-pick">'+exList('pick')+'</div>';
}
function render(){
  $('#view').innerHTML=ui.tab==='train'?vTrain():ui.tab==='lib'?vLib():vHist();
  $('#sheetbody').innerHTML=ui.sheet?vSheet():'';
  $('#sheet').hidden=!ui.sheet;
  document.querySelectorAll('#tabs button').forEach(function(b){
    if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  $('#topinfo').innerHTML=S.active?'<span class="pill">Trening trwa</span>':'';
}

/* ---------- Kopia zapasowa ---------- */
function exportJSON(){
  try{
    var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sztanga-kopia-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
    toast('Kopia zapisana w pobranych plikach');
  }catch(e){toast('Nie udało się pobrać pliku. Użyj „Kopiuj dane”');}
}
function copyJSON(){
  var txt=JSON.stringify(S);
  try{
    navigator.clipboard.writeText(txt).then(function(){toast('Dane skopiowane do schowka');},function(){toast('Nie udało się skopiować');});
  }catch(e){toast('Nie udało się skopiować');}
}

/* ---------- Zdarzenia ---------- */
var CONFIRM=['cancel','rmex','delw','delcustom'];
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,i=+t.dataset.i,j=+t.dataset.j;
  if(CONFIRM.indexOf(act)>-1){
    var key=act+':'+(t.dataset.id!=null?t.dataset.id:(t.dataset.i!=null?t.dataset.i:''));
    if(ui.armed!==key){
      ui.armed=key;render();
      setTimeout(function(){if(ui.armed===key){ui.armed=null;render();}},3500);
      return;
    }
  }
  ui.armed=null;
  switch(act){
    case 'tab':ui.tab=t.dataset.tab;ui.sheet=false;render();window.scrollTo(0,0);break;
    case 'start':startW();render();break;
    case 'pick':ui.sheet=true;ui.q.pick='';ui.g.pick='Wszystkie';render();break;
    case 'close':ui.sheet=false;render();break;
    case 'add':addEx(t.dataset.id);ui.sheet=false;render();toast('Dodano: '+exInfo(t.dataset.id).name);break;
    case 'addlib':addEx(t.dataset.id);ui.tab='train';ui.open=null;render();window.scrollTo(0,document.body.scrollHeight);toast('Dodano do treningu');break;
    case 'addset':
      var its=S.active.items[i].sets,l=its[its.length-1]||{};
      its.push({kg:l.kg||'',reps:l.reps||'',done:false});save();render();break;
    case 'delset':S.active.items[i].sets.pop();save();render();break;
    case 'rmex':S.active.items.splice(i,1);ui.tech=null;save();render();break;
    case 'tech':ui.tech=ui.tech===i?null:i;render();break;
    case 'grouppick':startW();ui.sheet=true;ui.q.pick='';ui.g.pick=t.dataset.g;render();break;
    case 'done':
      var s=S.active.items[i].sets[j];s.done=!s.done;
      if(s.done&&!num(s.reps)&&s.reps===''){/* puste powtórzenia policzą się dopiero po wpisaniu */}
      save();render();if(s.done)startRest();break;
    case 'finish':finishW();render();window.scrollTo(0,0);break;
    case 'cancel':S.active=null;rest=null;save();updRest();render();break;
    case 'grp':ui.g[t.dataset.ctx]=t.dataset.g;render();break;
    case 'open':ui.open=ui.open===t.dataset.id?null:t.dataset.id;render();break;
    case 'addform':ui.adding=true;render();var nn=$('#newname');if(nn)nn.focus();break;
    case 'cancelform':ui.adding=false;render();break;
    case 'savecustom':
      var name=$('#newname').value.trim();
      if(!name){toast('Wpisz nazwę ćwiczenia');return;}
      S.custom.push({id:'c'+uid(),name:name,group:$('#newgrp').value,custom:true});
      save();ui.adding=false;render();toast('Ćwiczenie dodane');break;
    case 'delcustom':S.custom=S.custom.filter(function(e){return e.id!==t.dataset.id;});ui.open=null;save();render();break;
    case 'hist':ui.hist=t.dataset.v;render();break;
    case 'openw':ui.openW=ui.openW===t.dataset.id?null:t.dataset.id;render();break;
    case 'delw':S.workouts=S.workouts.filter(function(w){return w.id!==t.dataset.id;});save();render();break;
    case 'restadd':if(rest){var dd=num(t.dataset.d)*1000;rest.end+=dd;rest.total=Math.max(rest.total,rest.end-Date.now());updRest();}break;
    case 'restskip':rest=null;updRest();break;
    case 'export':exportJSON();break;
    case 'copy':copyJSON();break;
    case 'import':$('#impfile').click();break;
    case 'install':
      if(dip){dip.prompt();dip.userChoice.then(function(){dip=null;render();});}
      break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.q){
    ui.q[t.dataset.q]=t.value;
    $('#list-'+t.dataset.q).innerHTML=exList(t.dataset.q);
    return;
  }
  if(t.dataset&&t.dataset.f&&S.active){
    S.active.items[+t.dataset.i].sets[+t.dataset.j][t.dataset.f]=t.value;
    save();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='restsel'){S.rest=+t.value;save();toast(S.rest?'Przerwa: '+S.rest+' s':'Przerwa wyłączona');}
  if(t.id==='impfile'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        if(!o||!Array.isArray(o.workouts)||!Array.isArray(o.custom))throw new Error('format');
        S=Object.assign(blank(),o);save();render();toast('Kopia wczytana');
      }catch(err){toast('To nie jest kopia z aplikacji Sztanga');}
      t.value='';
    };
    fr.readAsText(t.files[0]);
  }
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dip=e;if(ui.tab==='train'&&!S.active)render();});

setInterval(function(){
  updRest();
  if(S.active){var el=$('#elapsed');if(el)el.textContent=clock(Date.now()-S.active.start);}
},500);

/* ---------- Start ---------- */
